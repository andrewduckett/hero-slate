# Fails when the committed Let's Spec files (the rules block in AGENTS.md,
# the skills and the schemas) are out of date for the pinned release.
# Fix: run `mise exec -- lets sync` locally and commit what it writes.
name: lets sync --check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: mise exec -- lets sync --check
