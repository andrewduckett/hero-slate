# Avatar: Gemini 4 Argon, 2026-10-29. Look: wood elf, auburn hair, leaf circlet, fox kit Pip on shoulder.
# Sunny Thornwood — the walking-skeleton sample character.
# Identity fields (name, level, class, color) are validated this release.
# Her portrait is sunny.png beside this file: an avatar is named after its character.
name: Sunny Thornwood
level: 7
class: Druid
color: forest

# Abilities and combat are authored as ordered lists of { label, value } entries.
# Labels are author-driven: the app assumes no fixed abilities and no defaults.
# An ability's modifier is computed from its value; author a string value (e.g.
# "+2") to show a sign on a combat number.
abilities:
  - label: Strength
    value: 8
  - label: Dexterity
    value: 14
  - label: Constitution
    value: 14
  - label: Intelligence
    value: 12
  - label: Wisdom
    value: 20
  - label: Charisma
    value: 10
combat:
  - label: Armor Class
    value: 15
  - label: Speed
    value: 30
  - label: Initiative
    value: "+2"

# Maximum hit points is authored; current hit points are per-device state, not a
# definition field, so a new character starts at full health.
hitPoints:
  max: 52

# Resource-pool maximums are authored. Remaining uses are per-device state.
pools:
  - id: spell-slots-1
    label: 1st Level
    color: ocean
    max: 4
  - id: spell-slots-2
    label: 2nd Level
    color: ocean
    max: 3
  - id: spell-slots-3
    label: 3rd Level
    color: ocean
    max: 3
  - id: spell-slots-4
    label: 4th Level
    color: ocean
    max: 1
  - id: wild-shape
    label: Wild Shape
    color: forest
    max: 3

sections:
  - title: Strengths
    color: forest
    rows:
    - title: 👀 Spotting Things
      body: noticing what others miss, [[+8]] bonus
    - title: 🐾 Animal Friends
      body: calming & handling animals, [[+8]] bonus
    - title: 🤫 Sneaking
      body: moving quietly & hiding, [[+5]] bonus
    - title: 🌿 Forest Lore
      body: learn about plants, beasts, & the wild, [[+9]] bonus

  - title: Your Turn
    color: berry
    rows:
      - title: Attack
        body: "Wild Shape claws: [[d20+6]] to hit, [[2d6+4]] damage"
      - title: Cast a Spell
        body: "Cast a prepared spell — spell attack [[d20+8]], [[2d6+4]] damage, save [[DC 16]]"
      - title: Shapeshift
        body: "Use a Wild Shape to transform into an animal — Wolf, Bear, Horse, or Cat."
      - title: Land's Aid
        body: "Use a Wild Shape to make the forest erupt. Pick a spot and roll [[2d6]] — that number is how much damage the enemies take and how much your friend heals (enemies must pass [[DC16 Con]])."
      - title: Help
        body: Heal a friend for [[2d8 + 5]]) — or boost the team [[+d4]], make enemies easy to hit, and more).
