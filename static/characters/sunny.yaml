# Sunny Thornwood — the walking-skeleton sample character.
# Identity fields (name, level, class, color) are validated this release.
name: Sunny Thornwood
level: 6
class: Druid
color: forest

# Abilities and combat are authored as ordered lists of { label, value } entries.
# Labels are author-driven: the app assumes no fixed abilities and no defaults.
# An ability's modifier is computed from its value; author a string value (e.g.
# "+2") to show a sign on a combat number.
abilities:
  - label: Strength
    value: 10
  - label: Dexterity
    value: 14
  - label: Constitution
    value: 13
  - label: Intelligence
    value: 12
  - label: Wisdom
    value: 18
  - label: Charisma
    value: 11
combat:
  - label: Armor Class
    value: 16
  - label: Speed
    value: 30
  - label: Initiative
    value: "+2"

# Maximum hit points is authored; current hit points are per-device state, not a
# definition field, so a new character starts at full health.
hitPoints:
  max: 45

# Resource-pool maximums are authored. Remaining uses are per-device state.
pools:
  - id: wild-shape
    label: Wild Shape
    color: forest
    max: 2

sections:
  - title: Your Turn
    color: forest
    rows:
      - title: Attack
        body: "Wild Shape claws: [[d20+6]] to hit, [[2d6+4]] damage"
      - title: Shapeshift
        body: "Turn into a beast (CR ≤ 2). Use [[+4]] Wis save to hold form."
      - title: Spellcast
        body: "Cast a prepared spell — spell attack [[d20+6]], save DC 15"
      - title: Help
        body: Give an ally *advantage* on their next roll
  - title: Strengths
    color: forest
    rows:
      - title: Wild Empathy
        body: "Speak with beasts; they treat you as a friend [[+4]] bonus"
      - title: Druidic
        body: Leave hidden messages only druids can read
      - body: "**Thornwood grove** backs you — call for aid once per long rest"
